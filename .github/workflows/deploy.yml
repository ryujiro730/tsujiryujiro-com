name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VULTR_SSH_KEY }}

      - name: Add VPS to known hosts
        run: ssh-keyscan -H "${{ secrets.VULTR_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync code to VPS
        run: |
          rsync -avz \
            --exclude node_modules \
            --exclude .next \
            --exclude .git \
            --exclude .env.local \
            ./ ${{ secrets.VULTR_USER }}@${{ secrets.VULTR_HOST }}:/opt/lovechat/

      - name: Write .env on VPS
        run: |
          ssh ${{ secrets.VULTR_USER }}@${{ secrets.VULTR_HOST }} "cat > /opt/lovechat/.env << 'EOF'
          NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_APP_URL=https://tsujiryujiro.com
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }}
          LLM_PROVIDER=${{ secrets.LLM_PROVIDER }}
          OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL=${{ secrets.OPENROUTER_MODEL }}
          RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM=${{ secrets.EMAIL_FROM }}
          CRON_SECRET=${{ secrets.CRON_SECRET }}
          EOF"

      - name: Build and restart on VPS
        run: |
          ssh ${{ secrets.VULTR_USER }}@${{ secrets.VULTR_HOST }} \
            "cd /opt/lovechat && \
             docker compose build --no-cache && \
             docker compose up -d --remove-orphans && \
             docker image prune -f"

      - name: Setup crontab on VPS
        run: |
          ssh ${{ secrets.VULTR_USER }}@${{ secrets.VULTR_HOST }} \
            "(crontab -l 2>/dev/null | grep -v 'auto-broadcast'; echo '*/5 * * * * curl -s http://localhost:3001/api/cron/auto-broadcast -H \"Authorization: Bearer ${{ secrets.CRON_SECRET }}\" >> /var/log/humanchat-cron.log 2>&1') | crontab -"
