name: Deploy to VPS

on:
  push:
    branches:
      - main

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    environment: Production
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_APP_URL=https://aikano.chat
            NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_CHAT_ENABLED=${{ secrets.NEXT_PUBLIC_CHAT_ENABLED }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment: Production

    steps:
      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VULTR_SSH_KEY }}

      - name: Add VPS to known hosts
        run: ssh-keyscan -H "${{ secrets.VULTR_HOST }}" >> ~/.ssh/known_hosts

      - name: Write .env on VPS
        run: |
          ssh ${{ secrets.VULTR_USER }}@${{ secrets.VULTR_HOST }} "cat > /opt/lovechat/.env << 'EOF'
          NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_APP_URL=https://aikano.chat
          NEXT_PUBLIC_CHAT_ENABLED=${{ secrets.NEXT_PUBLIC_CHAT_ENABLED }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }}
          LLM_PROVIDER=${{ secrets.LLM_PROVIDER }}
          OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL=${{ secrets.OPENROUTER_MODEL }}
          RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM=${{ secrets.EMAIL_FROM }}
          CRON_SECRET=${{ secrets.CRON_SECRET }}
          EOF"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync docker-compose.yml to VPS
        run: |
          rsync -avz docker-compose.yml \
            ${{ secrets.VULTR_USER }}@${{ secrets.VULTR_HOST }}:/opt/lovechat/docker-compose.yml

      - name: Pull and restart on VPS
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          ssh ${{ secrets.VULTR_USER }}@${{ secrets.VULTR_HOST }} \
            "docker logout ghcr.io; \
             echo '$TOKEN' | docker login ghcr.io -u $ACTOR --password-stdin && \
             docker pull ghcr.io/${{ github.repository }}:latest && \
             docker stop lovechat-app-1 || true && \
             docker rm lovechat-app-1 || true && \
             docker run -d --name lovechat-app-1 -p 127.0.0.1:3001:3000 \
               --env-file /opt/lovechat/.env \
               -e NODE_ENV=production \
               --restart unless-stopped \
               ghcr.io/${{ github.repository }}:latest && \
             docker image prune -f"

      - name: Setup crontab on VPS
        run: |
          ssh ${{ secrets.VULTR_USER }}@${{ secrets.VULTR_HOST }} \
            "(crontab -l 2>/dev/null | grep -v 'auto-broadcast'; echo '* * * * * curl -s http://localhost:3001/api/cron/auto-broadcast -H \"Authorization: Bearer ${{ secrets.CRON_SECRET }}\" >> /var/log/humanchat-cron.log 2>&1') | crontab -"
